<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fff9e8">
  <meta name="description" content="有期：从家庭药箱开始，记录药品、厨房食材、日化用品的有效期。自定义标签，及时整理，少一点遗忘。">
  <title>有期 · 记好日期，安心有期</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=5">
  <script src="images.js?v=5" defer></script>
  <script src="app.js?v=7" defer></script>
</head>
<body>
<div id="medicine-tool">
  <div class="mt-app">
    <main class="mt-main">
      <header class="yq-simple-header"><h1>有期</h1><div class="yq-header-actions"><button id="yq-data" class="mt-text-button">数据管理</button><button class="mt-button mt-primary" id="mt-add"><span aria-hidden="true">＋</span> 新增</button></div></header>
      <section class="mt-overview" aria-label="有效期概览">
        <div class="mt-overview-copy"><span class="mt-kicker"><span id="yq-overview-tag">家庭药箱 · 药品优先</span></span><h2 id="mt-overview-title"></h2><p id="mt-overview-note"></p><button class="mt-text-button" id="mt-focus">查看需关注物品 <span aria-hidden="true">›</span></button></div>
        <img class="yq-overview-cat" src="design-cat.png" width="96" height="96" alt="">
        <div class="mt-stats"><button class="mt-stat" data-filter="soon"><strong id="mt-soon-count">0</strong><span><b class="mt-dot mt-amber"></b>即将到期</span></button><button class="mt-stat" data-filter="expired"><strong id="mt-expired-count">0</strong><span><b class="mt-dot mt-coral"></b>已过期</span></button><button class="mt-stat" data-filter="all"><strong id="mt-total-count">0</strong><span><b class="mt-dot mt-teal"></b>当前记录</span></button></div>
      </section>
        <section class="mt-list-section" aria-label="物品记录">
          <div class="mt-section-heading"><h2 id="yq-list-heading">我的药箱</h2><div class="yq-list-caption"><span id="yq-mode" class="yq-mode-badge" hidden>示例</span><span id="mt-date" class="mt-muted"></span></div></div>
          <div class="yq-tag-bar" id="yq-tags" aria-label="按标签筛选"></div>
          <div class="mt-list-controls">
            <div class="mt-tabs" aria-label="按有效期筛选"><button data-filter="all" class="mt-tab is-active" aria-pressed="true">全部状态</button><button data-filter="soon" class="mt-tab" aria-pressed="false">即将到期</button><button data-filter="expired" class="mt-tab" aria-pressed="false">已过期</button><button data-filter="archived" class="mt-tab" aria-pressed="false">已归档</button><button data-filter="attention" class="mt-tab" aria-pressed="false" hidden>需关注</button></div>
            <label class="mt-search"><span aria-hidden="true">⌕</span><input id="mt-search" type="search" placeholder="搜索名称、标识、标签" aria-label="搜索物品"></label>
          </div>
          <div class="mt-medicine-list" id="mt-list" aria-live="polite"></div>
          <div class="mt-list-footer"><span>有效期请按包装标注核对填写</span><span id="mt-visible-count"></span></div>
        </section>
    </main>
  </div>
  <div class="mt-overlay" id="mt-overlay" hidden><section class="mt-dialog" role="dialog" aria-modal="true" aria-labelledby="mt-dialog-title" id="mt-dialog"><div class="mt-dialog-header"><h2 id="mt-dialog-title"></h2><button class="mt-icon-button" id="mt-dialog-close" aria-label="关闭窗口">×</button></div><div id="mt-dialog-body"></div></section></div>
  <div class="mt-toast" id="mt-toast" role="status" hidden></div>
  <input type="file" id="yq-import-file" accept=".json,application/json" hidden aria-label="导入备份">
  <noscript><p>有期需要启用 JavaScript 才能保存和管理记录。</p></noscript>
</div>
</body>
</html>
